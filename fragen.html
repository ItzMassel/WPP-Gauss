<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gauß – Alle Fragen</title>
<style>
  :root {
    --background: #0d1117;
    --surface: #161b22;
    --surface-hover: #1c232c;
    --accent: #c9a84c;
    --text: #e6edf3;
    --text-muted: #9aa4af;
    --text-faint: #6b7580;
    --border: #2a313a;
    --ok: #5fb878;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--background);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 900px; margin: 0 auto; padding: 3rem 1rem 6rem; }
  h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-size: clamp(2rem, 5vw, 3rem);
    margin: 0 0 .25rem;
  }
  h1 em { color: var(--accent); }
  .sub { color: var(--text-muted); margin: 0 0 2rem; }

  .toolbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; gap: .75rem; align-items: center;
    background: rgba(13, 17, 23, .92); backdrop-filter: blur(8px);
    padding: .75rem 0; border-bottom: 1px solid var(--border); margin-bottom: 1.25rem;
  }
  .toolbar .count { color: var(--text-muted); font-size: .9rem; margin-left: auto; }
  .toolbar .count strong { color: var(--accent); }
  button, select, input[type="search"] {
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 3px;
    padding: .45rem .8rem; font: inherit; font-size: .85rem;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  input[type="search"] { min-width: 12rem; flex: 1 1 12rem; }

  .group h2 {
    font-size: .7rem; letter-spacing: .22em; text-transform: uppercase;
    color: var(--accent); margin: 2rem 0 .75rem;
    display: flex; align-items: center; gap: .6rem;
  }
  .group h2 label { cursor: pointer; display: flex; align-items: center; gap: .6rem; }

  .q {
    display: flex; gap: .9rem; align-items: flex-start;
    background: var(--surface); border: 1px solid var(--border);
    border-left: 2px solid var(--border);
    border-radius: 3px; padding: .9rem 1rem; margin-bottom: .6rem;
    cursor: pointer; transition: background .15s, border-color .15s;
  }
  .q:hover { background: var(--surface-hover); }
  .q.checked { border-left-color: var(--accent); }
  input[type="checkbox"] {
    width: 1.15rem; height: 1.15rem; margin-top: .2rem;
    accent-color: var(--accent); flex-shrink: 0; cursor: pointer;
  }
  .body { flex: 1; min-width: 0; }
  .title { font-weight: 500; }
  .meta { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .35rem; }
  .tag {
    font-size: .68rem; letter-spacing: .08em; text-transform: uppercase;
    color: var(--text-faint); border: 1px solid var(--border);
    border-radius: 2px; padding: .05rem .4rem;
  }
  .answer { margin: .6rem 0 0; padding: 0; list-style: none; font-size: .88rem; color: var(--text-muted); }
  .answer li { padding: .1rem 0; }
  .answer li.correct { color: var(--ok); }
  .answer li.correct::before { content: "✓ "; }
  .answer li:not(.correct)::before { content: "· "; color: var(--text-faint); }
  .answer.ordered { list-style: decimal inside; }
  .answer.ordered li::before { content: none; }
  .status { color: var(--text-muted); padding: 3rem 0; text-align: center; }
  .status.error { color: #e5736d; }
  mark { background: rgba(201, 168, 76, .3); color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Alle <em>Fragen</em></h1>
  <p class="sub" id="source">Live aus Sanity geladen (Projekt <code>59zxvwfo</code>, Dataset <code>production</code>).</p>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Fragen durchsuchen …">
    <select id="typeFilter" aria-label="Fragetyp"></select>
    <button id="selectAll" type="button">Alle auswählen</button>
    <button id="selectNone" type="button">Keine</button>
    <button id="copy" type="button">Auswahl kopieren</button>
    <span class="count"><strong id="selCount">0</strong> von <span id="totalCount">0</span> ausgewählt</span>
  </div>

  <div id="list"><div class="status">Lade Fragen …</div></div>
</main>

<script>
const PROJECT = '59zxvwfo', DATASET = 'production', API_VERSION = '2025-01-01';
const STORAGE_KEY = 'gauss-fragen-selected';

const TYPE_LABELS = {
  multiplechoice: 'Multiple Choice',
  yesno: 'Ja / Nein',
  guess: 'Schätzfrage',
  sort: 'Sortierung',
  text: 'Freitext',
};
const NO_LECTURE = 'Keiner Vorlesung zugewiesen';

const QUERY = `{
  "questions": *[_type == "question"] | order(_createdAt asc) {
    _id, question, type, multipleCorrect, options, correctAnswer,
    correctNumber, rangeMin, rangeMax, sortItems
  },
  "lectures": *[_type == "lecture"] | order(order asc) {
    title, "ids": questions[]._ref
  }
}`;

let questions = [];
let selected = new Set();

try { selected = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); } catch {}
const persist = () => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...selected])); } catch {} };

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};

function answerLines(q) {
  switch (q.type) {
    case 'multiplechoice':
      return { items: (q.options || []).map((o) => ({ text: o.label, correct: !!o.correct })) };
    case 'yesno':
      return { items: [{ text: q.correctAnswer ? 'Ja' : 'Nein', correct: true }] };
    case 'guess': {
      const range = q.rangeMin != null || q.rangeMax != null ? ` (Bereich: ${q.rangeMin ?? '–'} bis ${q.rangeMax ?? '–'})` : '';
      return { items: [{ text: `${q.correctNumber ?? '–'}${range}`, correct: true }] };
    }
    case 'sort':
      return { items: (q.sortItems || []).map((s) => ({ text: s })), ordered: true };
    default:
      return { items: [] };
  }
}

function render() {
  const term = $('search').value.trim().toLowerCase();
  const type = $('typeFilter').value;
  const list = $('list');
  list.replaceChildren();

  const visible = questions.filter((q) =>
    (!type || q.type === type) && (!term || (q.question || '').toLowerCase().includes(term)));

  if (!visible.length) {
    list.append(el('div', 'status', 'Keine Fragen gefunden.'));
    updateCount();
    return;
  }

  const groups = new Map();
  for (const q of visible) {
    const key = q.lectureTitle;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(q);
  }
  const ordered = [...groups.keys()].sort((a, b) => (a === NO_LECTURE) - (b === NO_LECTURE));

  for (const title of ordered) {
    const qs = groups.get(title);
    const group = el('section', 'group');
    const h = el('h2');
    const groupBox = document.createElement('input');
    groupBox.type = 'checkbox';
    groupBox.checked = qs.every((q) => selected.has(q._id));
    groupBox.title = 'Alle Fragen dieser Gruppe';
    groupBox.addEventListener('change', () => {
      qs.forEach((q) => groupBox.checked ? selected.add(q._id) : selected.delete(q._id));
      persist(); render();
    });
    const lbl = el('label');
    lbl.append(groupBox, document.createTextNode(`${title} · ${qs.length}`));
    h.append(lbl);
    group.append(h);

    for (const q of qs) {
      const row = el('label', 'q' + (selected.has(q._id) ? ' checked' : ''));
      const box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = selected.has(q._id);
      box.addEventListener('change', () => {
        box.checked ? selected.add(q._id) : selected.delete(q._id);
        row.classList.toggle('checked', box.checked);
        persist(); updateCount();
      });

      const body = el('div', 'body');
      body.append(el('div', 'title', q.question));
      const meta = el('div', 'meta');
      meta.append(el('span', 'tag', TYPE_LABELS[q.type] || q.type));
      if (q.type === 'multiplechoice') meta.append(el('span', 'tag', q.multipleCorrect ? 'Mehrfachauswahl' : 'Einzelauswahl'));
      body.append(meta);

      const { items, ordered: isOrdered } = answerLines(q);
      if (items.length) {
        const ul = el('ul', 'answer' + (isOrdered ? ' ordered' : ''));
        items.forEach((it) => ul.append(el('li', it.correct ? 'correct' : '', it.text)));
        body.append(ul);
      }
      row.append(box, body);
      group.append(row);
    }
    list.append(group);
  }
  updateCount();
}

function updateCount() {
  $('selCount').textContent = questions.filter((q) => selected.has(q._id)).length;
  $('totalCount').textContent = questions.length;
}

function visibleIds() {
  const term = $('search').value.trim().toLowerCase();
  const type = $('typeFilter').value;
  return questions
    .filter((q) => (!type || q.type === type) && (!term || (q.question || '').toLowerCase().includes(term)))
    .map((q) => q._id);
}

$('search').addEventListener('input', render);
$('typeFilter').addEventListener('change', render);
$('selectAll').addEventListener('click', () => { visibleIds().forEach((id) => selected.add(id)); persist(); render(); });
$('selectNone').addEventListener('click', () => { visibleIds().forEach((id) => selected.delete(id)); persist(); render(); });
$('copy').addEventListener('click', async (e) => {
  const text = questions.filter((q) => selected.has(q._id)).map((q) => `- ${q.question}`).join('\n');
  const btn = e.currentTarget, old = btn.textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = 'Kopiert ✓'; }
  catch { btn.textContent = 'Kopieren nicht möglich'; }
  setTimeout(() => (btn.textContent = old), 1500);
});

async function load() {
  const url = `https://${PROJECT}.apicdn.sanity.io/v${API_VERSION}/data/query/${DATASET}?query=${encodeURIComponent(QUERY)}`;
  try {
    let result;
    try {
      // Fails with "Failed to fetch" when opened as file:// (Sanity sends no CORS header for it)
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      result = (await res.json()).result;
    } catch (liveErr) {
      const snap = $('snapshot');
      if (!snap) throw liveErr;
      result = JSON.parse(snap.textContent);
      $('source').textContent = 'Offline-Stand (eingebetteter Snapshot) – neu erzeugen für aktuelle Daten.';
    }

    const lectureOf = new Map();
    for (const l of result.lectures) for (const id of l.ids || []) if (!lectureOf.has(id)) lectureOf.set(id, l.title);
    questions = result.questions.map((q) => ({ ...q, lectureTitle: lectureOf.get(q._id) || NO_LECTURE }));

    // drop stale selections for questions that no longer exist
    const known = new Set(questions.map((q) => q._id));
    selected = new Set([...selected].filter((id) => known.has(id)));

    const sel = $('typeFilter');
    sel.append(new Option('Alle Typen', ''));
    for (const t of [...new Set(questions.map((q) => q.type))]) sel.append(new Option(TYPE_LABELS[t] || t, t));

    render();
  } catch (err) {
    $('list').replaceChildren(el('div', 'status error', `Fragen konnten nicht geladen werden (${err.message}).`));
  }
}
load();
</script>
</body>
